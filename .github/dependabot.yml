version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Keep the API types pinned to the minimum supported VS Code version.
      - dependency-name: '@types/vscode'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
