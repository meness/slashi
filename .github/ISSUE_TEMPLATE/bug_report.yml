name: Bug report
description: Something in Slashi doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you type or press, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Press Cmd+/\n2. Type /f readme\n3. ..."
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Run `/diagnostics` in Slashi (or **Slashi: Copy Diagnostics for a Bug Report**) and paste the result. It holds versions and setup only, never keys, file names or code.
      placeholder: "Slashi: 0.1.0\nEditor: Visual Studio Code 1.95.0\nOS: darwin arm64 …"
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Run `/slashi-log` (Output → Slashi) and paste anything relevant. Remove secrets.
      render: text
