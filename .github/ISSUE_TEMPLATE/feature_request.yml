name: Feature request
description: A new slash command, provider, integration or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do without leaving the keyboard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would it work in Slashi?
      placeholder: '/deploy staging → runs ...'
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Files,
          Navigation,
          Project detection,
          Commands,
          Settings,
          Extensions,
          AI,
          Natural language,
          Text tools,
          Terminal,
          Git,
          Themes,
          Web,
          Custom commands,
          Marketplace,
          UI/UX,
          Other,
        ]
