name: Release

# release-please keeps a "chore(main): release x.y.z" PR open that bumps package.json and CHANGELOG.md
# from Conventional Commits. Merging it tags the release, and the publish job ships the .vsix.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT or app token lets CI run on the release PR; GITHUB_TOKEN-created PRs don't trigger workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    # Publishing secrets live in this environment, limited to main.
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: xvfb-run -a npm run test:integration
      - run: npm run package
      - name: Attach the .vsix to the GitHub release
        run: gh release upload "$TAG" *.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
      # Entra ID over OIDC (no stored secret) is preferred: Azure DevOps global PATs stop working on 2026-12-01.
      - name: Sign in to Microsoft Entra ID
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace
        if: env.AZURE_CLIENT_ID != '' || env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix ${AZURE_CLIENT_ID:+--azure-credential}
